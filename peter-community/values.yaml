replicaCount: 2

appName: community-app

deploymentControl:
  progressDeadlineSeconds: 300
  minReadySeconds: 10
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 40
  preStopSleepSeconds: 5

image:
  repository: peterj0117/community-backend
  tag: "v2.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: peter-ktb4.cloud

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 513Mi
