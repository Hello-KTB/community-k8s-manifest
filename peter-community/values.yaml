replicaCount: 2

image:
  repository: peterj0117/community-backend
  tag: "v2.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
    
ingress:
  enabled: true
  className: nginx
  host: peter-ktb4.cloud

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
