kube-prometheus-stack:
  grafana:
    adminPassword: "admin"
    service:
      type: ClusterIP
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - grafana.peter-ktb4.cloud
      paths: /

loki-stack:
  loki:
    enabled: true
    serviceName: "peter-monitoring-loki"
  promtail:
    enabled: true
    config:
      lokiAddress: http://peter-monitoring-loki:3100/loki/api/v1/push
    extraArgs:
      - -client.url=http://peter-monitoring-loki:3100/loki/api/v1/push
  file:
    loki-stack-datasource.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: "http://peter-monitoring-loki:3100"
          version: 1
          isDefault: false
