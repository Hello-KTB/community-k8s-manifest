kube-prometheus-stack:
  grafana:
    adminPassword: "admin"
    service:
      type: ClusterIP
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - grafana.peter-ktb4.cloud
      paths: /

loki-stack:
  loki:
    enabled: true
    serviceName: "peter-monitoring-loki"

  grafana:
    enabled: false
    sidecar:
      datasources:
        enabled: true
        isDefault: false

  promtail:
    enabled: true
    config:
      lokiAddress: http://peter-monitoring-loki:3100/loki/api/v1/push
    extraArgs:
      - -client.url=http://peter-monitoring-loki:3100/loki/api/v1/push
