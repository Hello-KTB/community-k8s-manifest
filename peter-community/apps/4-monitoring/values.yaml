kube-prometheus-stack:
  grafana:
    adminPassword: "admin"
    service:
      type: ClusterIP
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - grafana.peter-ktb4.cloud
      paths: /

loki-stack:
  loki:
    enabled: true
    datasource:
      enabled: false
  promtail:
    enabled: false
  file:
    datasource.yaml: false
  table:
    datasource.yaml: false
