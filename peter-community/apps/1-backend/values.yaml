appName: community-app

replicaCount: 2

deploymentControl:
  progressDeadlineSeconds: 300
  minReadySeconds: 10
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 40
  preStopSleepSeconds: 5

image:
  repository: peterj0117/community-backend
  tag: "v2.1.1"
  pullPolicy: IfNotPresent

service:
  name: peter-community-service # Ingress 연동을 위해 고정명 지정
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 513Mi
