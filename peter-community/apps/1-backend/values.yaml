appName: community-app

replicaCount: 2

deploymentControl:
  progressDeadlineSeconds: 300
  minReadySeconds: 10
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 40
  preStopSleepSeconds: 5

image:
  repository: peterj0117/community-backend
  tag: "v2.1.9"
  pullPolicy: IfNotPresent

service:
  name: peter-community-service # Ingress 연동을 위해 고정명 지정
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 513Mi
    
serviceMonitor:
  enabled: true
  namespace: monitoring # 프로메테우스가 감시하는 네임스페이스
  releaseLabel: peter-monitoring # Prometheus Operator의 release 라벨
  interval: 10s
  path: /actuator/prometheus
